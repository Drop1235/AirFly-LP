<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>本番環境 決済テスト専用ページ | AirFly</title>
  <link rel="icon" type="image/png" href="AirFly_faviconV2.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --color-bg: #f8fafc;
      --color-primary: #007aff;
      --color-primary-hover: #0056b3;
      --color-text-main: #1e293b;
      --color-text-sub: #64748b;
      --color-border: #e2e8f0;
      --color-danger: #ef4444;
      --color-warning-bg: #fffbeb;
      --color-warning-border: #fef3c7;
      --color-warning-text: #b45309;
      --radius: 16px;
      --font-body: 'Noto Sans JP', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--color-bg);
      color: var(--color-text-main);
      font-family: var(--font-body);
      line-height: 1.6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02);
      border: 1px solid var(--color-border);
      max-width: 540px;
      width: 100%;
      padding: 40px 32px;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-area {
      font-size: 24px;
      font-weight: 900;
      color: var(--color-primary);
      letter-spacing: 0.05em;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
      color: var(--color-text-main);
    }

    .alert-banner {
      background-color: var(--color-warning-bg);
      border: 1px solid var(--color-warning-border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 28px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      color: var(--color-warning-text);
      font-size: 14px;
    }

    .alert-banner i {
      font-size: 18px;
      margin-top: 2px;
    }

    .alert-title {
      font-weight: 700;
      margin-bottom: 4px;
    }

    .item-card {
      background: #f8fafc;
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item-info {
      text-align: left;
    }

    .item-label {
      font-size: 12px;
      color: var(--color-text-sub);
      font-weight: 700;
    }

    .item-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--color-text-main);
      margin-top: 2px;
    }

    .item-price {
      font-size: 20px;
      font-weight: 900;
      color: var(--color-primary);
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 8px;
      color: var(--color-text-main);
    }

    .required-badge {
      background-color: var(--color-danger);
      color: #ffffff;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 6px;
      vertical-align: middle;
    }

    .input-desc {
      font-size: 11px;
      color: var(--color-text-sub);
      margin-left: 6px;
      font-weight: normal;
    }

    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      color: var(--color-text-main);
      transition: all 0.2s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.15);
    }

    .form-input::placeholder {
      color: #cbd5e1;
    }

    .btn-submit {
      width: 100%;
      background: var(--color-primary);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.2);
      margin-top: 8px;
    }

    .btn-submit:hover {
      background: var(--color-primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(0, 122, 255, 0.25);
    }

    .btn-submit:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .footer-note {
      font-size: 12px;
      color: var(--color-text-sub);
      text-align: center;
      margin-top: 20px;
    }

    /* ローディングオーバーレイ */
    #loading-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.85);
      z-index: 9999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .loading-spinner {
      border: 4px solid rgba(0, 0, 0, 0.05);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border-left-color: var(--color-primary);
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="logo-area">
        <i class="fas fa-flask"></i> AirFly Test
      </div>
      <h2 class="title">本番環境テスト決済</h2>
    </div>

    <div class="alert-banner">
      <i class="fas fa-exclamation-triangle"></i>
      <div>
        <p class="alert-title">本番環境でのテスト決済です</p>
        <p>このページは本番環境（本番用Stripe決済）で動作します。実際に<b>50円</b>のクレジットカード決済が行われ、通常と同じ購入処理フロー（GAS連携など）がテストされます。</p>
      </div>
    </div>

    <div class="item-card">
      <div class="item-info">
        <p class="item-label">テスト商品（送料無料）</p>
        <p class="item-name">AirFly TEST-50</p>
      </div>
      <div class="item-price">¥50</div>
    </div>

    <form id="test-payment-form" onsubmit="handleTestPayment(event)">
      <div class="form-group">
        <label for="email">メールアドレス<span class="required-badge">必須</span></label>
        <input type="email" id="email" class="form-input" placeholder="example@example.com" required>
      </div>

      <div class="form-group">
        <label for="shipping-name">お名前<span class="required-badge">必須</span></label>
        <input type="text" id="shipping-name" class="form-input" placeholder="山田 太郎" required>
      </div>

      <div class="form-group">
        <label for="shipping-zip">郵便番号<span class="required-badge">必須</span><span class="input-desc">※ハイフンなし7桁</span></label>
        <input type="text" id="shipping-zip" class="form-input" placeholder="1234567" pattern="\d{7}" title="郵便番号はハイフンなしの7桁で入力してください。" required>
      </div>

      <div class="form-group">
        <label for="shipping-address">ご住所<span class="required-badge">必須</span></label>
        <input type="text" id="shipping-address" class="form-input" placeholder="東京都渋谷区〇〇 1-2-3 マンション101" required>
      </div>

      <div class="form-group">
        <label for="shipping-phone">電話番号<span class="required-badge">必須</span><span class="input-desc">※ハイフンなし</span></label>
        <input type="tel" id="shipping-phone" class="form-input" placeholder="09012345678" pattern="\d{10,11}" title="電話番号はハイフンなしの10桁または11桁で入力してください。" required>
      </div>

      <button type="submit" id="btn-submit" class="btn-submit">
        <i class="fas fa-lock"></i> 50円でテスト決済に進む
      </button>
    </form>

    <div class="footer-note">
      ※決済ボタンを押すと、Stripeの安全な決済画面へ遷移します。
    </div>
  </div>

  <!-- ローディングオーバーレイ -->
  <div id="loading-overlay">
    <div class="loading-spinner"></div>
    <p style="font-weight: 700; color: var(--color-text-main);">決済セッションを作成中...</p>
  </div>

  <script>
    function handleTestPayment(event) {
      event.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const name = document.getElementById('shipping-name').value.trim();
      const zip = document.getElementById('shipping-zip').value.trim();
      const address = document.getElementById('shipping-address').value.trim();
      const phone = document.getElementById('shipping-phone').value.trim();
      
      // Validation (HTML5 pattern has done most, but double check)
      if (!/^\d{7}$/.test(zip)) {
        alert('郵便番号はハイフンなしの半角数字7桁で入力してください。');
        return;
      }
      if (!/^\d{10,11}$/.test(phone)) {
        alert('電話番号はハイフンなしの半角数字10桁または11桁で入力してください。');
        return;
      }

      document.getElementById('loading-overlay').style.display = 'flex';
      document.getElementById('btn-submit').disabled = true;

      // Create test cart
      const cart = [{
        model: 'TEST-50',
        lens: 'テスト用レンズ',
        frame: 'テスト用フレーム'
      }];

      // Save pending order to localStorage so the main page success screen can parse and show it correctly
      localStorage.setItem('airfly_pending_order', JSON.stringify({
        items: cart,
        total_amount: '50円'
      }));

      // Also save email so main page behaves properly
      localStorage.setItem('airfly_registered_email', email);

      const payload = {
        email: email,
        customer_name: name,
        customer_zip: zip,
        customer_address: address,
        customer_phone: phone,
        items: cart
      };

      fetch('/.netlify/functions/create-checkout-session', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      })
      .then(response => {
        if (!response.ok) {
          return response.json().then(err => { throw err; });
        }
        return response.json();
      })
      .then(data => {
        if (data.url) {
          // Redirect to Stripe checkout
          window.location.href = data.url;
        } else {
          throw new Error('セッションURLがありませんでした。');
        }
      })
      .catch(err => {
        document.getElementById('loading-overlay').style.display = 'none';
        document.getElementById('btn-submit').disabled = false;
        console.error('Test checkout error:', err);
        alert('エラーが発生しました: ' + (err.error || err.message || '不明なエラー'));
      });
    }

    // Reset overlay state if user hits back button
    window.addEventListener('pageshow', function(event) {
      if (event.persisted) {
        document.getElementById('loading-overlay').style.display = 'none';
        document.getElementById('btn-submit').disabled = false;
      }
    });
  </script>
</body>
</html>
